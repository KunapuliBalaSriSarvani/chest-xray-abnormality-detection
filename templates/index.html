<!DOCTYPE html>
<html>
<head>
    <title>Chest X-ray AI System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4">
        <h2 class="text-center mb-4">Chest X-ray AI Diagnostic System</h2>
        <p class="text-center text-muted">
Deep Learning Based Thoracic Abnormality Detection using YOLOv8
</p>

        <form method="POST" enctype="multipart/form-data">
            <div class="mb-3">
                <label class="form-label">Patient Name</label>
                <input type="text" name="patient" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Upload Chest X-ray</label>
                <input type="file" name="image" class="form-control" required>
            </div>

            <button class="btn btn-primary w-100">Analyze X-ray</button>
        </form>
    </div>
</div>

</body>
</html>
