<!DOCTYPE html>
<html>
<head>
<title>AI Evaluation Dashboard</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body {
background:#0f172a;
color:white;
font-family:Segoe UI, sans-serif;
}
.card { border-radius:15px; }
.metric {
padding:20px;
border-radius:15px;
text-align:center;
font-weight:bold;
}
.green { background:linear-gradient(135deg,#11998e,#38ef7d); }
.blue { background:linear-gradient(135deg,#396afc,#2948ff); }
.orange { background:linear-gradient(135deg,#f46b45,#eea849); }
.purple { background:linear-gradient(135deg,#8e2de2,#4a00e0); }
</style>
</head>
<body>

<div class="container mt-5">

<h2 class="text-center mb-5">Model Performance Dashboard</h2>

<div class="row mb-4">

<div class="col-md-3">
<div class="metric green shadow">
mAP50
<h3>{{ metrics.map50 }}%</h3>
</div>
</div>

<div class="col-md-3">
<div class="metric blue shadow">
Precision
<h3>{{ metrics.precision }}%</h3>
</div>
</div>

<div class="col-md-3">
<div class="metric orange shadow">
Recall
<h3>{{ metrics.recall }}%</h3>
</div>
</div>

<div class="col-md-3">
<div class="metric purple shadow">
mAP50-95
<h3>{{ metrics.map5095 }}%</h3>
</div>
</div>

</div>

<div class="card p-4 mb-4 shadow">
<h4>Training & Loss Curves</h4>
<img src="{{ url_for('static', filename='evaluation/results.png') }}" class="img-fluid">
</div>

<div class="card p-4 mb-4 shadow">
<h4>Confusion Matrix</h4>
<img src="{{ url_for('static', filename='evaluation/confusion_matrix.png') }}" class="img-fluid">
</div>

<div class="card p-4 shadow">
<h4>Validation Predictions</h4>
<div class="row">
<div class="col-md-6">
<img src="{{ url_for('static', filename='evaluation/val_batch0_pred.jpg') }}" class="img-fluid">
</div>
<div class="col-md-6">
<img src="{{ url_for('static', filename='evaluation/val_batch1_pred.jpg') }}" class="img-fluid">
</div>
</div>
</div>

</div>

</body>
</html>
